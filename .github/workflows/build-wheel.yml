name: Build Wheel & CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[all,dev]'

      - name: Run test suite
        run: |
          PYTHONPATH=. python3 tests/test_all.py

  build:
    name: Build .whl & source tarball
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wheel and source distribution
        run: |
          python -m build

      - name: Validate distribution packages with Twine
        run: |
          twine check --strict dist/*

      - name: List built distribution files
        run: |
          ls -lah dist/

      - name: Test installing built wheel
        run: |
          WHL_FILE=$(ls dist/*.whl | head -n 1)
          pip install "${WHL_FILE}[all]"
          python -c "import bot_fork; print(f'Successfully imported bot_fork version {bot_fork.__version__}')"

      - name: Upload wheel & sdist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bot-fork-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release with .whl
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: bot-fork-dist
          path: dist

      - name: Create GitHub Release with wheel and tarball
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
