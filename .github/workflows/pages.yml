name: Pages

# Витрина https://ferrovovan.github.io/Bot-Fork/ собирается из живого прогона
# ядра: scripts/build_pages.py гоняет examples/demo_mars_pizza на mock-адаптере
# и встраивает транскрипт в site/index.html → _site/. Токены не нужны.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build_pages.py"
      - "examples/demo_mars_pizza.py"
      - "bot_fork/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python scripts/build_pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
