[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-fork"
version = "1.4.0"
authors = [
  { name = "Bot Fork Team" },
]
description = "Python-библиотека прототипирования диалоговых сцен для Telegram и ВКонтакте"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "python-dotenv"
]


[project.optional-dependencies]
telegram = [
    "aiogram>=3.4.0",
]
vk = [
    "vkbottle>=4.4.0",
]
all = [
    "aiogram>=3.4.0",
    "vkbottle>=4.4.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
"Homepage" = "https://github.com/ferrovovan/Bot-Fork"
"Documentation" = "https://github.com/ferrovovan/Bot-Fork#readme"

[tool.setuptools]
packages = ["bot_fork", "bot_fork.adapters"]
